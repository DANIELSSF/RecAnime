version: 2

updates:
  - package-ecosystem: gomod
    directory: /services/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  # Every `uses:` is pinned to a commit SHA; this ecosystem moves the pin and rewrites the trailing
  # version comment. The pinned release artifacts in swift-ci (SwiftFormat, XcodeGen) are not
  # covered — bump their version and SHA-256 by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: swift
    directory: /packages/RecAnimeKit
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      swift-minor-and-patch:
        update-types: [minor, patch]
