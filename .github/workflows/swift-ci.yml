name: swift-ci

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apple/**"
      - ".swiftformat"
      - "services/api/testdata/golden/**"
      - ".github/workflows/swift-ci.yml"
  pull_request:
    paths:
      - "packages/**"
      - "apple/**"
      - ".swiftformat"
      - "services/api/testdata/golden/**"
      - ".github/workflows/swift-ci.yml"

permissions:
  contents: read

concurrency:
  group: swift-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: packages (swift test + format + tokens + fixtures)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      # Pinned release artifact instead of Homebrew: the formula moves with the tap, this does not.
      # Bump SWIFTFORMAT_VERSION and SWIFTFORMAT_SHA256 together (shasum -a 256 swiftformat.zip).
      - name: Install SwiftFormat
        env:
          SWIFTFORMAT_VERSION: 0.62.1
          SWIFTFORMAT_SHA256: 7cb1cb1fae04932047c7015441c543848e8e60e1572d808d080e0a1f1661114a
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          echo "${SWIFTFORMAT_SHA256}  swiftformat.zip" | shasum -a 256 -c -
          unzip -oq swiftformat.zip -d swiftformat-unpacked
          install -m 0755 swiftformat-unpacked/swiftformat "$RUNNER_TEMP/bin/swiftformat"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/swiftformat" --version

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            packages/*/.build
          key: spm-packages-${{ runner.os }}-${{ hashFiles('packages/*/Package.resolved', 'packages/*/Package.swift') }}
          restore-keys: |
            spm-packages-${{ runner.os }}-

      - name: Test RecAnimeKit
        run: swift test --package-path packages/RecAnimeKit

      - name: Test RecAnimeUI
        run: swift test --package-path packages/RecAnimeUI

      # --lint goes after the paths so it is not parsed as consuming one.
      - name: SwiftFormat lint
        run: swiftformat apple packages --lint

      - name: Theme tokens
        run: sh apple/scripts/check-theme-tokens.sh

      - name: Swift fixtures match the Go golden files
        run: |
          if ! diff -rq services/api/testdata/golden packages/RecAnimeKit/Sources/RecAnimeKitTesting/Fixtures; then
            echo "::error::Swift fixtures are stale. Run: UPDATE_GOLDEN=1 pnpm api:test:it && pnpm fixtures:sync"
            exit 1
          fi

  apps:
    name: apps (xcodebuild iOS + watchOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcodebuild -version

      # Pinned release artifact instead of Homebrew (see the SwiftFormat step). xcodegen reads its
      # setting presets from ../share/xcodegen, so the whole layout is kept next to the binary.
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -oq xcodegen.zip -d xcodegen-unpacked
          install -m 0755 xcodegen-unpacked/xcodegen/bin/xcodegen "$RUNNER_TEMP/bin/xcodegen"
          rm -rf "$RUNNER_TEMP/share/xcodegen"
          mkdir -p "$RUNNER_TEMP/share"
          cp -R xcodegen-unpacked/xcodegen/share/xcodegen "$RUNNER_TEMP/share/xcodegen"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/xcodegen" --version

      # Without a workspace lock, xcodebuild (verified with 26.6) rewrites the committed
      # packages/RecAnimeKit/Package.resolved with the app-level graph and never creates its own
      # file. An empty pin list is a valid v3 lock (originHash is optional) and only forces a resolve.
      - name: Generate the Xcode project
        run: |
          cd apple && xcodegen generate
          ws=RecAnime.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          mkdir -p "$ws"
          [ -f "$ws/Package.resolved" ] || echo '{"pins":[],"version":3}' > "$ws/Package.resolved"

      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .dd/SourcePackages
          key: spm-apps-${{ runner.os }}-${{ hashFiles('packages/*/Package.resolved', 'packages/*/Package.swift', 'apple/project.yml') }}
          restore-keys: |
            spm-apps-${{ runner.os }}-

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project apple/RecAnime.xcodeproj \
            -scheme RecAnime \
            -derivedDataPath .dd

      # xcodebuild output goes to a log and only the interesting lines are echoed: grep finding
      # nothing must not fail the step, so `|| true` is on the grep and the exit code is xcodebuild's.
      - name: Build RecAnime (iOS)
        run: |
          set -uo pipefail
          xcodebuild build \
            -project apple/RecAnime.xcodeproj \
            -scheme RecAnime \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > build-ios.log 2>&1
          status=$?
          grep -E 'error:|warning:|Test Suite|Executed|BUILD|TEST' build-ios.log || true
          exit $status

      - name: Build RecAnimeWatch (watchOS)
        run: |
          set -uo pipefail
          xcodebuild build \
            -project apple/RecAnime.xcodeproj \
            -scheme RecAnimeWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath .dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > build-watchos.log 2>&1
          status=$?
          grep -E 'error:|warning:|Test Suite|Executed|BUILD|TEST' build-watchos.log || true
          exit $status

      # Tests need a real simulator, so pick whatever iPhone 17 runtime the
      # image ships instead of hard-coding a name and an OS version.
      - name: Run RecAnimeTests
        run: |
          set -uo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone 17")))')
          if [ -z "$UDID" ]; then
            echo "::error::no available iPhone 17 simulator on this image"
            exit 1
          fi
          echo "Simulator UDID: $UDID"
          xcodebuild test \
            -project apple/RecAnime.xcodeproj \
            -scheme RecAnime \
            -destination "id=$UDID" \
            -only-testing:RecAnimeTests \
            -derivedDataPath .dd \
            -resultBundlePath RecAnimeTests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > test-ios.log 2>&1
          status=$?
          grep -E 'error:|warning:|Test Suite|Executed|BUILD|TEST' test-ios.log || true
          exit $status

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RecAnimeTests-xcresult
          path: |
            RecAnimeTests.xcresult
            *.log
          if-no-files-found: ignore
