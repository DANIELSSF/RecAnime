name: keep-alive

# Supabase pauses free projects after 7 days without database activity. /readyz runs SELECT 1.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_BASE_URL != '' }}
    steps:
      - run: curl -fsS --max-time 30 "${{ vars.API_BASE_URL }}/readyz"
