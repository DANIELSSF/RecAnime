name: keep-alive

# Supabase pauses free projects after 7 days without database activity. /readyz runs SELECT 1.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Set by infra/gcp/deploy.sh's follow-up step: Settings > Secrets and variables > Actions >
    # Variables > API_BASE_URL. The job fails loudly until it exists, on purpose: a silently
    # skipped keep-alive is how a project ends up paused.
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - run: |
          : "${API_BASE_URL:?set the API_BASE_URL repository variable (Settings → Secrets and variables → Actions)}"
          curl -fsS --max-time 30 "$API_BASE_URL/readyz"
